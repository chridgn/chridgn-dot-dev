<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Christian Quebral</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.7;
      color: #292929;
      background: #fff;
      padding: 0 24px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 0 120px;
    }

    header { margin-bottom: 72px; }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin-top: 6px;
      color: #6b6b6b;
    }

    .header-links {
      margin-top: 12px;
    }

    .header-links a {
      font-size: 0.875rem;
      color: #6b6b6b;
      text-decoration: none;
      border-bottom: 1px solid #d0d0d0;
      padding-bottom: 1px;
    }

    .header-links a:hover { color: #292929; border-color: #292929; }

    section { margin-bottom: 60px; }

    h2 {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #9b9b9b;
      margin-bottom: 20px;
    }

    /* Link lists (projects, misc) */
    .link-list { list-style: none; }

    .link-list li {
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .link-list li:first-child { border-top: 1px solid #f0f0f0; }

    .link-list a {
      color: inherit;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .link-list a:hover .item-title { text-decoration: underline; }

    .item-title { font-weight: 500; }

    .item-desc {
      font-size: 0.875rem;
      color: #6b6b6b;
      margin-top: 2px;
    }

    .item-date {
      font-size: 0.8rem;
      color: #9b9b9b;
      margin-top: 3px;
    }

    .item-thumb {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="site-name"></h1>
      <p class="subtitle" id="site-subtitle"></p>
      <div class="header-links">
        <a href="https://github.com/chridgn" target="_blank" rel="noopener noreferrer">github.com/chridgn</a>
      </div>
    </header>

    <section>
      <h2>Projects</h2>
      <ul class="link-list" id="projects-list"></ul>
    </section>

    <section>
      <h2>Miscellaneous</h2>
      <ul class="link-list" id="misc-list"></ul>
    </section>
  </div>

  <script src="content.js"></script>
  <script>
    document.getElementById("site-name").textContent = SITE.name;
    document.getElementById("site-subtitle").textContent = SITE.subtitle;

    const projectsList = document.getElementById("projects-list");
    PROJECTS.forEach(p => {
      const li = document.createElement("li");
      li.innerHTML = `<a href="projects/#${p.slug}">
        ${p.banner ? `<img class="item-thumb" src="${p.banner}" alt="${p.title}">` : ""}
        <div>
          <div class="item-title">${p.title}</div>
          <div class="item-desc">${p.description}</div>
        </div>
      </a>`;
      projectsList.appendChild(li);
    });

    const miscList = document.getElementById("misc-list");
    MISC.forEach(item => {
      const li = document.createElement("li");
      li.innerHTML = `<a href="${item.url}" target="_blank" rel="noopener noreferrer">
        <div>
          <div class="item-title">${item.title}</div>
          <div class="item-desc">${item.description}</div>
        </div>
      </a>`;
      miscList.appendChild(li);
    });
  </script>
</body>
</html>
